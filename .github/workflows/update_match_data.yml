name: Update Match Data

on:
  schedule:
    - cron: "0 */3 * * *"   # 하루 전까지는 3시간 단위 업데이트
    - cron: "0 * * * *"     # 경기 당일은 1시간 단위 업데이트
    - cron: "*/5 * * * *"   # 경기 시작 20분 전까지는 5분 단위 업데이트
    - cron: "*/1 * * * *"   # 경기 시작 5분 전부터는 1분 단위 업데이트 (연장전 포함)

  workflow_dispatch:        # 수동 실행 기능 추가

jobs:
  update_match_data:
    runs-on: ubuntu-latest  # GitHub Actions 실행 환경

    steps:
      - name: 📥 저장소 체크아웃
        uses: actions/checkout@v3

      - name: 🛠️ Python 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'  # Python 버전 설정

      - name: 📦 필수 패키지 설치
        run: |
          pip install -r requirements.txt

      - name: ⏳ 경기 업데이트 주기 결정 및 실행
        run: |
          python soccer-json-live/scripts/soccer-json-live_1208293.py

      - name: 📤 변경된 데이터 푸시
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add data/*
          git commit -m "🔄 경기 데이터 업데이트: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" || echo "No changes to commit"
          git push || echo "No changes to push"
